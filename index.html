<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PS Cloudphone</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 240px; height: 320px;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Courier New", Courier, monospace;
    font-weight: bold;
    font-size: 9px;
    -webkit-text-size-adjust: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { width: 240px; height: 320px; position: relative; }

  /* ---------- TOP HALF: battle view ---------- */
  #top-half {
    width: 240px; height: 160px;
    box-sizing: border-box;
    border-bottom: 2px solid #fff;
    background: #111;
    position: relative;
    overflow: hidden;
  }
  .hpbar-row {
    height: 16px; box-sizing: border-box;
    display: flex; align-items: center;
    padding: 1px 3px; gap: 2px;
    background: #000; font-size: 8px;
    white-space: nowrap; overflow: hidden;
  }
  .hpbar-outer {
    width: 66px; height: 6px;
    border: 1px solid #fff; background: #333;
    margin: 0 2px; flex: none;
  }
  .hpbar-inner { height: 100%; width: 100%; background: #3c3; }
  .hpbar-inner.mid { background: #dd3; }
  .hpbar-inner.low { background: #e33; }
  .status-badge {
    font-size: 7px; padding: 0 2px;
    background: #555; color: #fd6; border-radius: 2px;
  }
  .lvl-tag { font-size: 7px; color: #aaa; }
  .hp-num { font-size: 7px; color: #9f9; margin-left: auto; }

  #sprite-stage { position: relative; height: 96px; }
  .sprite {
    position: absolute; width: 56px; height: 56px;
    object-fit: contain; image-rendering: pixelated;
  }
  .opp-sprite { top: 2px; right: 8px; }
  .player-sprite { bottom: 2px; left: 8px; }
  .fainted { filter: grayscale(1) brightness(0.4); opacity: 0.5; }

  #log {
    height: 32px; box-sizing: border-box;
    overflow: hidden;
    font-size: 8px; line-height: 10px;
    padding: 2px 3px;
    background: #000; border-top: 1px solid #333;
  }
  #log div { white-space: normal; }

  /* ---------- BOTTOM HALF: action grid ---------- */
  #bottom-half {
    width: 240px; height: 160px;
    box-sizing: border-box; padding: 2px;
    background: #050505;
  }
  #tabs-row { display: flex; height: 16px; margin-bottom: 2px; gap: 2px; }
  .tab {
    flex: 1; text-align: center; font-size: 9px;
    line-height: 15px; border: 1px solid #666; background: #222; color: #ccc;
    box-sizing: border-box;
  }
  .tab.active-mode { background: #335; color: #fff; }
  .tab.focused { border-color: #ff0; box-shadow: inset 0 0 0 1px #ff0; }

  #grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    height: 138px;
  }
  .cell {
    border: 2px solid #666; background: #1c1c1c;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 9px; text-align: center;
    padding: 2px; box-sizing: border-box;
    overflow: hidden; color: #fff;
  }
  .cell.disabled { color: #555; border-color: #333; background: #141414; }
  .cell.focused { border-color: #ff0; box-shadow: 0 0 0 2px #ff0 inset; }
  .cell .sub { font-size: 7px; color: #9c9; margin-top: 2px; }
  .cell.disabled .sub { color: #666; }
</style>
</head>
<body>
<div id="app">
  <div id="top-half">
    <div class="hpbar-row" id="opp-bar">
      <span id="opp-name">---</span>
      <span class="lvl-tag" id="opp-lvl"></span>
      <div class="hpbar-outer"><div class="hpbar-inner" id="opp-hp"></div></div>
      <span class="status-badge" id="opp-status"></span>
    </div>
    <div id="sprite-stage">
      <img id="opp-sprite" class="sprite opp-sprite" style="visibility:hidden">
      <img id="player-sprite" class="sprite player-sprite" style="visibility:hidden">
    </div>
    <div class="hpbar-row" id="player-bar">
      <span id="player-name">---</span>
      <span class="lvl-tag" id="player-lvl"></span>
      <div class="hpbar-outer"><div class="hpbar-inner" id="player-hp"></div></div>
      <span class="status-badge" id="player-status"></span>
      <span class="hp-num" id="player-hp-text"></span>
    </div>
    <div id="log"></div>
  </div>
  <div id="bottom-half">
    <div id="tabs-row"></div>
    <div id="grid"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ==========================================================
  // CONFIG
  // ==========================================================
  var WS_URL = 'wss://sim3.psim.us/showdown/websocket';
  var FORMATS = [
    { id: 'gen9randombattle', label: 'RANDOM'  },
    { id: 'gen9ou',           label: 'OU'      },
    { id: 'gen9ubers',        label: 'UBERS'   },
    { id: 'gen9nu',           label: 'NU'      }
  ];

  // Showdown ID sanitizer, exactly as specified.
  function toID(text){
    return (text || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  }

  function $(id){ return document.getElementById(id); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  }

  // ==========================================================
  // STATE
  // ==========================================================
  var ws = null;
  var myUsername = '';
  var mySlot = null;      // 'p1' or 'p2', once known
  var roomId = null;      // current battle room id, e.g. "battle-gen9randombattle-123"
  var appState = 'connecting'; // connecting | lobby | searching | battle | ended
  var battle = null;

  var logLines = [];
  var focus = { r: 1, c: 0 };  // r: 0=tabs (if present), 1-2: grid rows. c: 0-1
  var menu = { tabs: null, activeTab: 0, moveGrid: null, switchGrid: null };

  function resetBattle(){
    battle = {
      turn: 0,
      p1: { name: '', active: null },
      p2: { name: '', active: null }
    };
  }
  resetBattle();

  // ==========================================================
  // LOG
  // ==========================================================
  function addLog(text){
    logLines.push(text);
    if (logLines.length > 60) logLines.shift();
    renderLog();
  }
  function renderLog(){
    var el = $('log');
    var last = logLines.slice(-6);
    el.innerHTML = last.map(function(l){ return '<div>' + escapeHtml(l) + '</div>'; }).join('');
    el.scrollTop = el.scrollHeight;
  }

  // ==========================================================
  // NETWORKING
  // ==========================================================
  function connect(){
    appState = 'connecting';
    addLog('Connecting...');
    renderLobbyGrid();
    ws = new WebSocket(WS_URL);
    ws.onopen = function(){ addLog('Connected.'); };
    ws.onclose = function(){
      addLog('Disconnected. Reconnecting...');
      setTimeout(connect, 3000);
    };
    ws.onerror = function(){ /* onclose will fire too */ };
    ws.onmessage = function(ev){ handleFrame(ev.data); };
  }

  // Showdown room command protocol: "ROOMID|/command args"
  // Global (non-room) commands use an empty ROOMID -> "|/command args"
  function sendCmd(room, cmd){
    if (!ws || ws.readyState !== 1) return;
    ws.send((room || '') + '|' + cmd);
  }

  // ==========================================================
  // PROTOCOL PARSING
  // A single WS frame may contain multiple lines; lines starting
  // with ">" switch the "current room" for subsequent lines.
  // ==========================================================
  function handleFrame(data){
    var lines = data.split('\n');
    var room = '';
    for (var i = 0; i < lines.length; i++){
      var line = lines[i];
      if (line.charAt(0) === '>'){ room = line.slice(1).trim(); continue; }
      if (!line || line.charAt(0) !== '|') continue;
      processLine(room, line);
    }
  }

  function identName(ident){
    // "p1a: Nickname" -> "Nickname"
    var i = ident.indexOf(': ');
    return i >= 0 ? ident.slice(i + 2) : ident;
  }
  function identSide(ident){ return ident.slice(0, 2); } // "p1" / "p2"

  function parseCondition(cond){
    if (!cond) return { hp: 100, maxhp: 100, status: '', fainted: false };
    var sp = cond.split(' ');
    var frac = sp[0], status = sp[1] || '';
    if (frac === '0' || status === 'fnt') return { hp: 0, maxhp: 1, status: 'fnt', fainted: true };
    var fp = frac.split('/');
    var hp = parseInt(fp[0], 10);
    var maxhp = parseInt(fp[1], 10) || 100;
    return { hp: hp, maxhp: maxhp, status: status, fainted: false };
  }

  function processLine(room, line){
    var parts = line.split('|');
    var cmd = parts[1];

    switch (cmd){

      case 'challstr':
        // This lightweight client plays as an auto-assigned guest
        // (no login POST / password flow), since text entry isn't
        // practical on a D-pad-only device.
        addLog('Ready to play as guest.');
        break;

      case 'updateuser':
        myUsername = parts[2] || myUsername;
        if (appState === 'connecting'){
          appState = 'lobby';
          addLog('Playing as ' + myUsername);
          renderLobbyGrid();
        }
        break;

      case 'init':
        if (parts[2] === 'battle'){
          roomId = room;
          resetBattle();
          appState = 'battle';
          renderBattleView();
          setWaitingGrid();
        }
        break;

      case 'player':
        {
          var pslot = parts[2], pname = parts[3];
          if ((pslot === 'p1' || pslot === 'p2') && pname){
            battle[pslot].name = pname;
            if (myUsername && pname.toLowerCase() === myUsername.toLowerCase()){
              mySlot = pslot;
            }
            renderBars();
          }
        }
        break;

      case 'poke':
        {
          var side = parts[2];
          var species = (parts[3] || '').split(',')[0].trim();
          if (side && side !== mySlot && species){
            addLog('Opponent has ' + species + '.');
          }
        }
        break;

      case 'switch':
      case 'drag':
        handleSwitch(parts);
        break;

      case 'turn':
        battle.turn = parseInt(parts[2], 10) || 0;
        addLog('-- Turn ' + battle.turn + ' --');
        break;

      case 'move':
        addLog(identName(parts[2]) + ' used ' + parts[3] + '!');
        break;

      case '-damage':
      case '-heal':
        handleHpUpdate(parts);
        break;

      case '-status':
        handleStatus(parts[2], parts[3]);
        break;

      case '-curestatus':
        handleStatus(parts[2], '');
        break;

      case 'faint':
        handleFaint(parts[2]);
        break;

      case 'request':
        handleRequest(parts.slice(2).join('|'));
        break;

      case 'win':
        appState = 'ended';
        addLog(parts[2] + ' won the battle!');
        showEndGrid();
        break;

      case 'tie':
        appState = 'ended';
        addLog('The battle ended in a tie.');
        showEndGrid();
        break;

      case 'error':
        addLog('Error: ' + parts.slice(2).join('|'));
        break;

      default:
        break;
    }
  }

  function handleSwitch(parts){
    var ident = parts[2], details = parts[3], cond = parts[4];
    var side = identSide(ident);
    if (side !== 'p1' && side !== 'p2') return;
    var speciesPart = details.split(',')[0].trim();
    var levelMatch = details.match(/L(\d+)/);
    var level = levelMatch ? levelMatch[1] : '100';
    var hp = parseCondition(cond);
    battle[side].active = {
      nickname: identName(ident),
      species: speciesPart,
      id: toID(speciesPart),
      level: level,
      hp: hp.hp, maxhp: hp.maxhp, status: hp.status, fainted: hp.fainted
    };
    addLog(identName(ident) + ' was sent out.');
    renderBars();
    renderSprites();
  }

  function handleHpUpdate(parts){
    var ident = parts[2], cond = parts[3];
    var side = identSide(ident);
    if (!battle[side] || !battle[side].active) return;
    var hp = parseCondition(cond);
    var a = battle[side].active;
    a.hp = hp.hp; a.maxhp = hp.maxhp; a.status = hp.status; a.fainted = hp.fainted;
    renderBars();
  }

  function handleStatus(ident, status){
    var side = identSide(ident);
    if (!battle[side] || !battle[side].active) return;
    battle[side].active.status = status;
    renderBars();
  }

  function handleFaint(ident){
    var side = identSide(ident);
    if (!battle[side] || !battle[side].active) return;
    battle[side].active.hp = 0;
    battle[side].active.fainted = true;
    addLog(identName(ident) + ' fainted!');
    renderBars();
    renderSprites();
  }

  // ==========================================================
  // |request| -> build the action menu
  // ==========================================================
  function handleRequest(json){
    if (!json) return;
    var req;
    try { req = JSON.parse(json); } catch (e) { return; }
    if (!req) return;

    if (req.teamPreview){
      // Auto-confirm default team order to keep this client simple
      // (no drag/reorder UI on a D-pad-only device).
      sendCmd(roomId, '/choose team 123456');
      addLog('Team preview auto-confirmed.');
      return;
    }
    if (req.wait){ setWaitingGrid(); return; }
    if (req.forceSwitch && req.forceSwitch[0]){ buildSwitchMenu(req); return; }
    if (req.active){ buildMoveMenu(req); return; }
    setWaitingGrid();
  }

  function buildSwitchCells(req){
    var pokes = (req.side && req.side.pokemon) || [];
    var cells = [];
    for (var i = 0; i < pokes.length && cells.length < 4; i++){
      var p = pokes[i];
      if (p.active) continue;
      var cond = parseCondition(p.condition);
      if (cond.fainted) continue;
      var species = p.details.split(',')[0].trim();
      cells.push({
        label: species,
        sub: cond.hp + '/' + cond.maxhp,
        disabled: false,
        onActivate: (function(slot){ return function(){
          sendCmd(roomId, '/choose switch ' + slot);
          setWaitingGrid();
        }; })(i + 1)
      });
    }
    // Note: only the first 4 eligible switch-ins are shown, to fit
    // the fixed 2x2 action grid on a single screen.
    while (cells.length < 4) cells.push({ label: '', disabled: true });
    return cells;
  }

  function buildMoveMenu(req){
    var moves = req.active[0].moves || [];
    var trapped = !!req.active[0].trapped;
    var cells = [];
    for (var i = 0; i < 4; i++){
      if (moves[i] && !moves[i].move){ /* skip malformed */ }
      if (moves[i]){
        var m = moves[i];
        cells.push({
          label: m.move,
          sub: (typeof m.pp !== 'undefined') ? (m.pp + '/' + m.maxpp) : '',
          disabled: !!m.disabled,
          onActivate: (function(idx){ return function(){
            sendCmd(roomId, '/choose move ' + (idx + 1));
            setWaitingGrid();
          }; })(i)
        });
      } else {
        cells.push({ label: '', disabled: true });
      }
    }
    menu = {
      tabs: trapped ? null : ['FIGHT', 'TEAM'],
      activeTab: 0,
      moveGrid: cells,
      switchGrid: buildSwitchCells(req)
    };
    focus = { r: 1, c: 0 };
    renderMenu();
  }

  function buildSwitchMenu(req){
    menu = { tabs: null, moveGrid: null, switchGrid: buildSwitchCells(req) };
    focus = { r: 1, c: 0 };
    addLog('Choose a Pokemon to send out.');
    renderMenu();
  }

  function setWaitingGrid(){
    menu = { tabs: null, moveGrid: null, switchGrid: null };
    focus = { r: 0, c: 0 };
    renderMenu();
  }

  function showEndGrid(){
    menu = {
      tabs: null,
      moveGrid: [
        { label: 'BACK TO', sub: 'LOBBY', disabled: false, onActivate: backToLobby },
        { label: '', disabled: true },
        { label: '', disabled: true },
        { label: '', disabled: true }
      ],
      switchGrid: null
    };
    focus = { r: 1, c: 0 };
    renderMenu();
  }

  function backToLobby(){
    appState = 'lobby';
    roomId = null; mySlot = null;
    renderLobbyGrid();
  }

  // ==========================================================
  // LOBBY
  // ==========================================================
  function renderLobbyGrid(){
    clearTopBattleView();
    var busy = (appState !== 'lobby');
    var cells = FORMATS.map(function(f){
      return {
        label: f.label,
        sub: '',
        disabled: busy,
        onActivate: function(){
          sendCmd('', '/search ' + f.id);
          appState = 'searching';
          addLog('Searching for a ' + f.label + ' battle...');
          renderLobbyGrid();
        }
      };
    });
    menu = { tabs: null, moveGrid: cells, switchGrid: null };
    focus = { r: 1, c: 0 };
    renderMenu();
  }

  function clearTopBattleView(){
    $('opp-name').textContent = '---';
    $('opp-lvl').textContent = '';
    $('opp-status').textContent = '';
    $('player-name').textContent = '---';
    $('player-lvl').textContent = '';
    $('player-status').textContent = '';
    $('player-hp-text').textContent = '';
    $('opp-hp').style.width = '0%';
    $('player-hp').style.width = '0%';
    $('opp-sprite').style.visibility = 'hidden';
    $('player-sprite').style.visibility = 'hidden';
  }

  // ==========================================================
  // BATTLE VIEW RENDERING
  // ==========================================================
  function renderBattleView(){
    renderBars();
    renderSprites();
  }

  function hpClass(hp, maxhp){
    var pct = maxhp ? (hp / maxhp * 100) : 0;
    if (pct <= 20) return 'low';
    if (pct <= 50) return 'mid';
    return '';
  }

  function getSides(){
    var opp = (mySlot === 'p1') ? battle.p2 : battle.p1;
    var me  = (mySlot === 'p1') ? battle.p1 : battle.p2;
    if (!mySlot){ opp = battle.p2; me = battle.p1; }
    return { opp: opp, me: me };
  }

  function renderBars(){
    var s = getSides(), opp = s.opp, me = s.me;

    if (opp.active){
      $('opp-name').textContent = opp.active.nickname;
      $('opp-lvl').textContent = 'L' + opp.active.level;
      var pct = opp.active.maxhp ? (opp.active.hp / opp.active.maxhp * 100) : 0;
      $('opp-hp').style.width = pct + '%';
      $('opp-hp').className = 'hpbar-inner ' + hpClass(opp.active.hp, opp.active.maxhp);
      $('opp-status').textContent = opp.active.status ? opp.active.status.toUpperCase() : '';
    }
    if (me.active){
      $('player-name').textContent = me.active.nickname;
      $('player-lvl').textContent = 'L' + me.active.level;
      var pct2 = me.active.maxhp ? (me.active.hp / me.active.maxhp * 100) : 0;
      $('player-hp').style.width = pct2 + '%';
      $('player-hp').className = 'hpbar-inner ' + hpClass(me.active.hp, me.active.maxhp);
      $('player-status').textContent = me.active.status ? me.active.status.toUpperCase() : '';
      $('player-hp-text').textContent = me.active.hp + '/' + me.active.maxhp;
    }
  }

  function renderSprites(){
    var s = getSides(), opp = s.opp, me = s.me;
    var oppImg = $('opp-sprite'), meImg = $('player-sprite');

    if (opp.active){
      oppImg.style.visibility = 'visible';
      oppImg.className = 'sprite opp-sprite' + (opp.active.fainted ? ' fainted' : '');
      oppImg.onerror = function(){ oppImg.style.visibility = 'hidden'; };
      oppImg.src = 'https://play.pokemonshowdown.com/sprites/gen5/' + opp.active.id + '.png';
    }
    if (me.active){
      meImg.style.visibility = 'visible';
      meImg.className = 'sprite player-sprite' + (me.active.fainted ? ' fainted' : '');
      meImg.onerror = function(){ meImg.style.visibility = 'hidden'; };
      meImg.src = 'https://play.pokemonshowdown.com/sprites/gen5-back/' + me.active.id + '.png';
    }
  }

  // ==========================================================
  // MENU / GRID RENDERING
  // ==========================================================
  function activeCellsFor(m){
    if (m.tabs) return (m.activeTab === 0) ? m.moveGrid : m.switchGrid;
    return m.moveGrid || m.switchGrid || [];
  }

  function renderMenu(){
    var tabsRow = $('tabs-row');
    if (menu.tabs){
      tabsRow.style.display = 'flex';
      tabsRow.innerHTML = menu.tabs.map(function(t, i){
        var cls = 'tab' +
          (menu.activeTab === i ? ' active-mode' : '') +
          (focus.r === 0 && focus.c === i ? ' focused' : '');
        return '<div class="' + cls + '">' + escapeHtml(t) + '</div>';
      }).join('');
    } else {
      tabsRow.style.display = 'none';
    }

    var cells = activeCellsFor(menu);
    var grid = $('grid');
    grid.innerHTML = '';
    for (var i = 0; i < 4; i++){
      var c = (cells && cells[i]) || { label: '', disabled: true };
      var row = 1 + Math.floor(i / 2), col = i % 2;
      var div = document.createElement('div');
      div.className = 'cell' +
        (c.disabled ? ' disabled' : '') +
        (focus.r === row && focus.c === col ? ' focused' : '');
      div.innerHTML = escapeHtml(c.label || '') +
        (c.sub ? '<div class="sub">' + escapeHtml(c.sub) + '</div>' : '');
      grid.appendChild(div);
    }
  }

  // ==========================================================
  // D-PAD INPUT
  // Focus matrix: row 0 = tabs (only if menu.tabs is set),
  // rows 1-2 = the 2x2 action grid, cols 0-1.
  // ==========================================================
  function moveFocus(dr, dc){
    var minRow = menu.tabs ? 0 : 1;
    var maxRow = 2;
    var nr = focus.r + dr, nc = focus.c + dc;
    if (nr < minRow) nr = minRow;
    if (nr > maxRow) nr = maxRow;
    if (nc < 0) nc = 0;
    if (nc > 1) nc = 1;
    focus = { r: nr, c: nc };
    renderMenu();
  }

  function activateFocused(){
    if (menu.tabs && focus.r === 0){
      menu.activeTab = focus.c;
      focus = { r: 1, c: 0 };
      renderMenu();
      return;
    }
    var cells = activeCellsFor(menu);
    var idx = (focus.r - 1) * 2 + focus.c;
    var cell = cells && cells[idx];
    if (cell && !cell.disabled && cell.onActivate) cell.onActivate();
  }

  document.addEventListener('keydown', function(e){
    switch (e.key){
      case 'ArrowUp':    moveFocus(-1, 0); e.preventDefault(); break;
      case 'ArrowDown':  moveFocus(1, 0);  e.preventDefault(); break;
      case 'ArrowLeft':  moveFocus(0, -1); e.preventDefault(); break;
      case 'ArrowRight': moveFocus(0, 1);  e.preventDefault(); break;
      case 'Enter':
      case ' ':
      case 'Spacebar':
        activateFocused(); e.preventDefault(); break;
      default: break;
    }
  }, false);

  // ==========================================================
  // BOOT
  // ==========================================================
  connect();

})();
</script>
</body>
</html>
